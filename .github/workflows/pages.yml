name: Publish living-ascii demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'examples/**'
      - 'package*.json'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare browser-only version
        run: node scripts/build-pages.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published demo resources
        run: |
          set -euo pipefail
          base="https://qianchencc.github.io/living-ascii/"
          for path in index.html src/main.js vendor/three.module.js examples/grass.png; do
            echo "Checking ${base}${path}"
            curl -fsSL --retry 6 --retry-delay 3 --retry-all-errors "${base}${path}" -o "/tmp/$(basename "${path}")"
            file "/tmp/$(basename "${path}")"
          done
          node -e 'const f=require("fs");const p=f.readFileSync("/tmp/grass.png"); if(p.length<100000||p.subarray(0,8).toString("hex")!=="89504e470d0a1a0a")throw Error("Invalid PNG response"); console.log("PNG VERIFIED",p.length,"bytes")'
